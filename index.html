<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音 AI 助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 主面板：AI 对话 -->
    <div class="panel panel-right">
        <div class="panel-header">
            <span class="panel-icon">&#129504;</span>
            <span class="panel-title">AI 助手</span>
            <div class="panel-actions">
                <!-- 麦克风选择 -->
                <select id="micSelect" class="mic-select-inline" title="选择录音设备">
                    <option value="">正在检测设备...</option>
                </select>
                <!-- 固定模型：qwen3-vl:4b，地址已硬编码 192.168.1.32:11434 -->
                <span class="model-badge">qwen3-vl:4b</span>
                <button id="clearChatBtn" class="clear-btn" title="清空对话">&#128465;</button>
            </div>
        </div>

        <!-- 对话消息区 -->
        <div id="chatMessages" class="chat-messages">
            <div class="chat-welcome">
                <div class="welcome-icon">&#129504;</div>
                <p>你好！我是本地 AI 助手（qwen3-vl:4b）</p>
                <p class="welcome-sub">点击语音输入按钮直接对话，或在此输入文字</p>
            </div>
        </div>

        <!-- 输入区 -->
        <div class="chat-input-area">
            <textarea id="chatInput" class="chat-input" placeholder="输入消息，或点击语音输入直接对话..." rows="3"></textarea>
            <div class="chat-input-actions">
                <span id="aiStatus" class="ai-status"></span>
                <button id="stopGenBtn" class="stop-btn" style="display:none">&#9632; 停止</button>
                <button id="recordBtn" class="voice-input-btn" title="语音输入">
                    <span class="voice-icon">&#127908;</span>
                    <span class="voice-text">语音输入</span>
                </button>
                <button id="chatSendBtn" class="chat-send-btn">发送 &#9654;</button>
            </div>
        </div>
    </div>

    <!-- 显示器控制面板 -->
    <div id="monitorPanel" class="panel panel-monitor">
        <div class="panel-header">
            <span class="panel-icon">&#128431;</span>
            <span class="panel-title">显示器控制</span>
            <div class="panel-actions">
                <select id="displayType" class="display-type-sel" title="选择显示器类型">
                    <option value="native" selected>内置屏幕</option>
                    <option value="adb">外置屏幕</option>
                </select>
                <!-- DDC/CI 支持状态 -->
                <span id="ddcciStatusDot" class="status-dot status-dot-off" title="DDC/CI 支持状态"></span>
                <span id="ddcciStatusText" class="ddcci-status-text">DDC/CI 未知</span>
                <span id="i2cStatusDot" class="status-dot status-dot-off"></span>
                <span id="i2cStatusText" class="i2c-status-text">未连接</span>
                <button id="exitBtn" class="exit-btn" title="退出">&#10006;</button>
            </div>
        </div>

        <div class="monitor-controls">
            <!-- 亮度控制 -->
            <div class="control-section">
                <div class="control-label-row">
                    <label class="control-label">&#9728;&#65039; 亮度</label>
                    <span id="brightnessValue" class="control-value">50</span>
                </div>
                <input type="range" id="brightnessSlider" class="control-slider brightness-slider"
                       min="0" max="100" value="50">
                <div class="slider-marks">
                    <span>0</span><span>50</span><span>100</span>
                </div>
                <!-- 快捷操作按钮 -->
                <div class="quick-actions">
                    <button class="monitor-btn" data-action="brightness" data-value="0">&#127769; 最暗</button>
                    <button class="monitor-btn" data-action="brightness" data-value="50">&#128161; 中等</button>
                    <button class="monitor-btn" data-action="brightness" data-value="100">&#9728;&#xFE0F; 最亮</button>
                </div>
            </div>

            <!-- 对比度控制 -->
            <div class="control-section">
                <div class="control-label-row">
                    <label class="control-label">&#9673; 对比度</label>
                    <span id="contrastValue" class="control-value">50</span>
                </div>
                <input type="range" id="contrastSlider" class="control-slider contrast-slider"
                       min="0" max="100" value="50">
                <div class="slider-marks">
                    <span>0</span><span>50</span><span>100</span>
                </div>
            </div>

            <!-- 系统音量 -->
            <div class="control-section">
                <div class="control-label-row">
                    <label class="control-label">&#128266; 音量</label>
                    <span id="volumeValue" class="control-value">50</span>
                </div>
                <input type="range" id="volumeSlider" class="control-slider volume-slider"
                       min="0" max="100" value="50">
                <div class="slider-marks">
                    <span>&#128265; 静音</span><span>50</span><span>&#128264; 最大</span>
                </div>
                <!-- 快捷操作按钮 -->
                <div class="quick-actions">
                    <button class="monitor-btn" data-action="volume" data-value="0">&#128265; 静音</button>
                    <button class="monitor-btn" data-action="volume" data-value="33">1/3</button>
                    <button class="monitor-btn" data-action="volume" data-value="66">2/3</button>
                    <button class="monitor-btn" data-action="volume" data-value="100">&#128264; 最大</button>
                </div>
            </div>

            <!-- 识别日志 -->
            <details class="debug-details debug-details-monitor">
                <summary>&#128269; 识别日志</summary>
                <pre id="debugLog" class="debug-box debug-box-monitor"></pre>
            </details>
        </div>
    </div>

    <!-- 依赖脚本 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="ollama-api.js"></script>
    <script src="sensevoice-api.js"></script>
    <script src="native-display-api.js"></script>
    <script src="ddcci-api.js"></script>
    <script src="i2c-api.js"></script>
    <script src="main.js"></script>
</body>
</html>
